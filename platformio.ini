[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
lib_deps = 
	ottowinter/AsyncTCP-esphome@^1.1.1
	ottowinter/ESPAsyncWebServer-esphome@^3.1.0
	suculent/ESP32httpUpdate@^2.1.145
	knolleary/PubSubClient@^2.8
	thomasfredericks/Bounce2@^2.55
	miguel5612/ThermistorLibrary@^1.0.3
	rkoptev/ACS712 Current Sensor@^1.0.2
	paulstoffregen/OneWire@^2.3.5
	ottowinter/ESPAsyncTCP-esphome@^1.2.3
	bblanchon/ArduinoJson@6.21.3
	rpolitex/ArduinoNvs@^2.5
	dwinhmi/DWIN_DGUS_HMI@^1.1.2
monitor_speed = 115200
